<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d11">
  <title>Госпошлина и подсудность — Челябинск</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d11;
      --elev: #14181f;
      --elev-2: #1c222c;
      --line: rgba(212, 184, 138, 0.2);
      --gold: #d4b88a;
      --gold-2: #f3e2c2;
      --text: #f4f0e8;
      --muted: #a69d90;
      --danger: #f0c2c2;
      --danger-bg: rgba(140, 58, 58, 0.22);
      --warn: #f0ddb0;
      --warn-bg: rgba(160, 120, 48, 0.18);
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      --radius: 20px;
      --tap: 56px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      color: var(--text);
      font-family: Manrope, "Segoe UI", sans-serif;
      font-size: 17px;
      line-height: 1.45;
      background: radial-gradient(900px 420px at 50% -8%, rgba(212, 184, 138, 0.14), transparent 60%), var(--bg);
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .wrap { width: min(760px, 100%); margin: 0 auto; padding: 28px 18px 48px; }
    .brand { display: flex; gap: 14px; align-items: center; margin-bottom: 22px; }
    .seal { width: 52px; height: 52px; flex: 0 0 52px; border: 1px solid var(--gold); border-radius: 50%; display: grid; place-items: center; color: var(--gold-2); font-family: "Cormorant Garamond", Georgia, serif; font-size: 28px; background: rgba(212, 184, 138, 0.06); }
    .brand h1 { margin: 0; font-family: "Cormorant Garamond", Georgia, serif; font-size: 34px; font-weight: 600; line-height: 1; }
    .brand p { margin: 6px 0 0; color: var(--muted); font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 6px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); border-radius: 18px; margin-bottom: 18px; }
    .tab { min-height: var(--tap); border: 0; border-radius: 14px; background: transparent; color: var(--muted); font-weight: 600; }
    .tab.active { background: linear-gradient(180deg, #2a241c, #1a1713); color: var(--gold-2); box-shadow: inset 0 0 0 1px rgba(212, 184, 138, 0.45); }
    .panel { display: none; }
    .panel.active { display: block; }
    .card { background: linear-gradient(180deg, rgba(255,255,255,0.025), transparent 40%), var(--elev); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
    .label { display: block; margin: 0 0 10px; color: var(--muted); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
    .select-custom, input[type="number"], input[type="text"] { width: 100%; min-height: var(--tap); padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); background: #0e1116; font-size: 18px; color: #fff; margin-bottom: 16px; }
    .fee-box { text-align: center; padding: 20px; background: #12100c; border: 1px solid var(--gold); border-radius: 18px; margin-top: 15px; }
    .fee-box h2 { font-size: 40px; color: var(--gold-2); margin: 10px 0 0; }
    .btn { width: 100%; min-height: var(--tap); background: linear-gradient(180deg, #d4b88a, #b89d6c); border: 0; border-radius: 16px; color: #0b0d11; font-weight: 750; font-size: 18px; text-transform: uppercase; margin-top: 10px; }
    .result-item { padding: 12px; background: rgba(255,255,255,0.02); border-radius: 12px; margin-top: 8px; border-left: 3px solid var(--gold); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="seal">§</div>
      <div>
        <h1>Помощник Юриста</h1>
        <p>Челябинск • Госпошлина и Подсудность</p>
      </div>
    </div>
    
    <div class="tabs">
      <button class="tab active" onclick="switchTab('fee')">Госпошлина</button>
      <button class="tab" onclick="switchTab('court')">Подсудность</button>
    </div>

    <!-- Панель Госпошлины -->
    <div id="panel-fee" class="panel active">
      <div class="card">
        <label class="label">Тип иска</label>
        <select id="claim-type" class="select-custom" onchange="togglePriceInput()">
          <option value="имущественный">Имущественного характера (подлежащий оценке)</option>
          <option value="неимущественный">Неимущественного характера / Имущественный без оценки</option>
          <option value="развод">Расторжение брака</option>
          <option value="алименты">Взыскание алиментов</option>
        </select>

        <div id="price-block">
          <label class="label">Цена иска (рубли)</label>
          <input type="number" id="claim-price" placeholder="Введите сумму" value="100000" oninput="calcFee()">
        </div>

        <div class="fee-box">
          <span class="label" style="color:var(--gold)">Размер госпошлины</span>
          <h2 id="fee-result">4 000 ₽</h2>
        </div>
      </div>
    </div>

    <!-- Панель Подсудности -->
    <div id="panel-court" class="panel">
      <div class="card">
        <label class="label">Выберите район Челябинска</label>
        <select id="district-select" class="select-custom" onchange="findCourt()">
          <option value="">-- Выберите район --</option>
          <option value="Калининский">Калининский район</option>
          <option value="Курчатовский">Курчатовский район</option>
          <option value="Ленинский">Ленинский район</option>
          <option value="Металлургический">Металлургический район</option>
          <option value="Советский">Советский район</option>
          <option value="Тракторозаводский">Тракторозаводский район</option>
          <option value="Центральный">Центральный район</option>
        </select>

        <div id="court-result" style="display:none; margin-top:15px;">
          <div class="result-item">
            <strong>Районный суд:</strong> <span id="r-court-name"></span><br>
            <small style="color:var(--muted)">Адрес: </small><span id="r-court-addr" style="font-size:15px;"></span>
          </div>
          <div class="result-item" style="margin-top:15px;">
            <strong>Мировые судьи:</strong> Нажмите кнопку ниже для выбора точного участка в районе<br>
            <button class="btn" style="min-height:44px; font-size:14px;" id="mirsud-btn" onclick="window.open('https://mirsud74.ru', '_blank')">Открыть участки на MirSud74.ru</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      if(tab === 'fee') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('panel-fee').classList.add('active');
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('panel-court').classList.add('active');
      }
    }

    function togglePriceInput() {
      const type = document.getElementById('claim-type').value;
      document.getElementById('price-block').style.display = (type === 'имущественный') ? 'block' : 'none';
      calcFee();
    }

    function calcFee() {
      const type = document.getElementById('claim-type').value;
      let fee = 0;

      if (type === 'имущественный') {
        const price = parseFloat(document.getElementById('claim-price').value) || 0;
        if (price <= 100000) fee = Math.max(4000, price * 0.04);
        else if (price <= 300000) fee = 4000 + (price - 100000) * 0.03;
        else if (price <= 500000) fee = 10000 + (price - 300000) * 0.02;
        else if (price <= 1000000) fee = 14000 + (price - 500000) * 0.01;
        else fee = Math.min(900000, 19000 + (price - 1000000) * 0.005);
      } else if (type === 'неимущественный') {
        fee = 3000;
      } else if (type === 'развод') {
        fee = 5000;
      } else if (type === 'алименты') {
        fee = 150;
      }

      document.getElementById('fee-result').innerText = Math.round(fee).toLocaleString('ru-RU') + ' ₽';
    }

    const courts = {
      "Калининский": { name: "Калининский районный суд г. Челябинска", addr: "ул. Каслинская, д. 42" },
      "Курчатовский": { name: "Курчатовский районный суд г. Челябинска", addr: "ул. Куйбышева, д. 30" },
      "Ленинский": { name: "Ленинский районный суд г. Челябинска", addr: "ул. Новороссийская, д. 50" },
      "Металлургический": { name: "Металлургический районный суд г. Челябинска", addr: "ул. Богдана Хмельницкого, д. 33" },
      "Советский": { name: "Советский районный суд г. Челябинска", addr: "ул. Монакова, д. 2-а" },
      "Тракторозаводский": { name: "Тракторозаводский районный суд г. Челябинска", addr: "ул. Танкистов, д. 179" },
      "Центральный": { name: "Центральный районный суд г. Челябинска", addr: "ул. Коммуны, д. 87" }
    };

    function findCourt() {
      const dist = document.getElementById('district-select').value;
      const resBlock = document.getElementById('court-result');
      if(!dist) { resBlock.style.display = 'none'; return; }
      
      resBlock.style.display = 'block';
      document.getElementById('r-court-name').innerText = courts[dist].name;
      document.getElementById('r-court-addr').innerText = courts[dist].addr;
    }
  </script>
</body>
</html>
